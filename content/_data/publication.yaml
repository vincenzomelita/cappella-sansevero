# Contributors
# ------------------------------------------------------------------------------

contributor_as_it_appears:

contributor:
  - id: lcoiro
    type: secondary
    first_name: Luigi
    last_name: Coiro
    title: Assegnista di ricerca
    role: other-role
    bio: "**Luigi Coiro** è assegnista di ricerca presso il Dipartimento di Scienze umane e sociali dell’Università degli Studi di Napoli L'Orientale. Ha conseguito la specializzazione all’Università degli Studi di Napoli Federico II e il dottorato di ricerca al Suor Orsola Benincasa. Studioso del Sei e Settecento meridionale, con particolare riguardo alla scultura e alla vicenda di Cosimo Fanzago, è stato collaboratore scientifico della Bibliotheca Hertziana – Istituto Max-Planck per la storia dell’arte e del CIRICE – Centro Interdipartimentale di Ricerca sull’Iconografia della Città Europea della Federico II per il progetto _Naples Digital Archive_."

  - id: gforgione
    type: secondary
    first_name: Gianluca
    last_name: Forgione
    title: Professore associato
    affiliation: Museo Cappella San Severo
    bio: "**Gianluca Forgione** è professore associato di Museologia e critica artistica e del restauro all’Università degli Studi di Ferrara. Si è addottorato all’Università degli Studi di Napoli Federico II con una tesi sui Girolamini, pubblicata in volume nel 2020, e ha svolto attività di ricerca, tra gli altri, per la Bibliotheca Hertziana – Istituto Max Planck per la storia dell’arte, per la Fondazione Longhi e per la Fondazione 1563 per l’Arte e la Cultura della Compagnia di San Paolo. I suoi interessi scientifici riguardano in particolare le relazioni artistiche tra Napoli, Roma e l’Emilia in Età barocca. Nel 2022 ha pubblicato uno studio sulla committenza artistica di Raimondo di Sangro (_I simulacri delle cose. La Cappella Sansevero e il barocco romano_)."

  - id: siorio
    type: secondary
    first_name: Sabrina
    last_name: Iorio
    title: Consulente
    affiliation: Museo Cappella San Severo
    bio: "**Sabrina Iorio** è consulente presso la Fondazione Banco di Napoli come archivista e umanista digitale, e collabora a progetti di ricerca, databasing e digitalizzazione con le Università degli Studi di Napoli Federico II e Suor Orsola Benincasa. Ha conseguìto il suo dottorato di ricerca alla Federico II con una tesi su Giacomo Lazzari e l’arte marmoraria del primo Seicento a Napoli, concentrandosi in particolare sugli aspetti socio-economici legati al funzionamento delle botteghe e alle dinamiche proprie di alcuni dei maggiori cantieri barocchi della città."

  - id: eloiodice
    type: secondary
    first_name: Eleonora
    last_name: Loiodice
    title: Dottorato di ricerca
    affiliation: Museo Cappella San Severo
    bio: "**Eleonora Loiodice** ha conseguito il dottorato di ricerca in Studi Umanistici (Storia della Scienza) presso l’Università degli Studi di Bari, di cui è stata anche assegnista di ricerca. Nel 2020 ha ottenuto una borsa di ricerca dal Museo Cappella Sansevero e dall’Istituto Italiano di Studi Filosofici di Napoli, e attualmente è docente di Storia e Filosofia nelle scuole superiori. Le sue ricerche si concentrano sulla storia del pensiero scientifico nei suoi rapporti con l’antropologia, la teologia e la mitologia comparata; in particolare è specialista del pensiero filosofico e scientifico in età moderna e contemporanea, nonché di storia e tecniche della comunicazione scientifica."

  - id: arusso
    type: secondary
    first_name: Augusto
    last_name: Russo
    title: Ricercatore
    affiliation: Museo Cappella San Severo
    bio: "**Augusto Russo** è ricercatore di Storia dell’arte moderna all’Università degli Studi di Napoli Federico II. Ha conseguito il dottorato di ricerca nel medesimo ateneo, ed è stato borsista della Fondazione 1563 per l’Arte e la Cultura della Compagnia di San Paolo. I suoi interessi di ricerca vertono sulla pittura e la scultura d’Età barocca, con particolare attenzione al contesto napoletano, alla personalità di Francesco De Mura e al genere del ritratto. Ha effettuato un soggiorno di ricerca presso il Courtauld Institute of Art di Londra (2023-24)."

  - id: msaggiomo
    type: secondary
    first_name: Mariano
    last_name: Saggiomo
    title: Dottorato di ricerca
    affiliation: Museo Cappella San Severo
    bio: "**Mariano Saggiomo** si è addottorato all’Università degli Studi di Napoli Federico II, occupandosi in particolare di arte napoletana in età moderna in riferimento al patronato laico dei luoghi di culto e al collezionismo sei e settecentesco. È docente a contratto di Storia dell’arte moderna nel medesimo ateneo, e borsista post-doc della Bibliotheca Hertziana – Istituto Max Planck per la storia dell’arte. È attualmente in via di pubblicazione, per la collana digitale dell’Hertziana, la sua monografia _Memorie perdute. Chiese gentilizie napoletane tra tardo Medioevo ed Età moderna._"

