# ------------------------------------------------------------------------------
# Contributors
# ------------------------------------------------------------------------------

contributor_as_it_appears:

contributor:
  - id: lcoiro
    type: primary
    first_name: Luigi
    last_name: Coiro
    title: Assegnista di ricerca
    affiliation: Museo Cappella San Severo
    bio: "Luigi Coiro è assegnista di ricerca presso il Dipartimento di Scienze umane e sociali dell’Università Orientale di Napoli. Ha conseguito la specializzazione all’Università degli Studi di Napoli Federico II e il dottorato di ricerca al Suor Orsola Benincasa. Studioso del Sei e Settecento meridionale, con particolare riguardo alla scultura e alla vicenda di Cosimo Fanzago, è stato collaboratore scientifico della Bibliotheca Hertziana – Istituto Max-Planck per la storia dell’arte e del CIRICE – Centro Interdipartimentale di Ricerca sull’Iconografia della Città Europea della Federico II per il progetto Naples Digital Archive."
    image: contributors/luigicoiro.jpg

  - id: gforgione
    type: secondary
    first_name: Gianluca
    last_name: Forgione
    title: Professore associato
    affiliation: Museo Cappella San Severo
    bio: "Gianluca Forgione è professore associato di Museologia e critica artistica e del restauro all’Università degli Studi di Ferrara. Si è addottorato all’Università degli Studi di Napoli Federico II con una tesi sui Girolamini, pubblicata in volume nel 2020, e ha svolto attività di ricerca, tra gli altri, per la Bibliotheca Hertziana – Istituto Max Planck per la storia dell’arte, per la Fondazione Longhi e per la Fondazione 1563 per l’Arte e la Cultura della Compagnia di San Paolo. I suoi interessi scientifici riguardano in particolare le relazioni artistiche tra Napoli, Roma e l’Emilia in Età barocca. Nel 2022 ha pubblicato uno studio sulla committenza artistica di Raimondo di Sangro (I simulacri delle cose. La Cappella Sansevero e il barocco romano)."
    image: contributors/gianlucaforgione.jpg

  - id: siorio
    type: secondary
    first_name: Sabrina
    last_name: Iorio
    title: Consulente
    affiliation: Museo Cappella San Severo
    bio: "Sabrina Iorio è consulente presso la Fondazione Banco di Napoli come archivista e umanista digitale, e collabora a progetti di ricerca, databasing e digitalizzazione con le Università degli Studi di Napoli Federico II e Suor Orsola Benincasa. Ha conseguìto il suo dottorato di ricerca alla Federico II con una tesi su Giacomo Lazzari e l’arte marmoraria del primo Seicento a Napoli, concentrandosi in particolare sugli aspetti socio-economici legati al funzionamento delle botteghe e alle dinamiche proprie di alcuni dei maggiori cantieri barocchi della città."
    image: contributors/gianlucaforgione.jpg

